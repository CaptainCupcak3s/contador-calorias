<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MacroControl V3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    
    <!-- MÓDULO 1: DATOS FÍSICOS (Basado en tu captura) -->
    <div class="card">
      <h2 class="card-title">Tus Datos Físicos</h2>
      <form id="tdee-form">
        
        <div class="form-group">
          <label>Género Biológico</label>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="M" checked> Hombre</label>
            <label><input type="radio" name="gender" value="F"> Mujer</label>
          </div>
        </div>

        <div class="form-row grid-3">
          <div class="form-group">
            <label>Edad</label>
            <input type="number" id="age" value="21" required>
          </div>
          <div class="form-group">
            <label>Peso (kg)</label>
            <input type="number" id="weight" step="0.1" value="74" required>
          </div>
          <div class="form-group">
            <label>Altura (cm)</label>
            <input type="number" id="height" value="175" required>
          </div>
        </div>

        <div class="form-row grid-2">
          <div class="form-group">
            <label>Pasos Diarios</label>
            <input type="number" id="steps" value="8000" required>
          </div>
          <div class="form-group">
            <label>Entreno (kcal)</label>
            <input type="number" id="workout-kcal" value="300" required>
          </div>
        </div>

        <!-- Botones rápidos para tu Split -->
        <div class="quick-workouts">
          <span class="qw-label">Autocompletar entreno:</span>
          <button type="button" class="btn-qw" onclick="setWorkout(0)">Descanso</button>
          <button type="button" class="btn-qw" onclick="setWorkout(350)">Empuje / Tirón</button>
          <button type="button" class="btn-qw" onclick="setWorkout(450)">Piernas</button>
          <button type="button" class="btn-qw" onclick="setWorkout(500)">Boxeo / TRX</button>
        </div>

        <div class="form-group">
          <label>% de Déficit</label>
          <select id="deficit">
            <option value="0">Mantenimiento (0%)</option>
            <option value="10">Ligero (10%)</option>
            <option value="20" selected>20% - Recomendado</option>
            <option value="-10">Volumen Limpio (+10%)</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">Calcular Metas</button>
      </form>
    </div>

    <div id="app-content" class="hidden">
      <!-- MÓDULO 2: PROGRESO DIARIO -->
      <div class="card">
        <h2 class="card-title">Resumen Diario</h2>
        <div class="progress-container">
          <div class="prog-item">
            <div class="prog-label"><span>Calorías</span> <span id="txt-cal">0/0</span></div>
            <div class="prog-bar"><div id="bar-cal" class="fill fill-cal"></div></div>
          </div>
          <div class="prog-item">
            <div class="prog-label"><span>Proteínas</span> <span id="txt-pro">0/0g</span></div>
            <div class="prog-bar"><div id="bar-pro" class="fill fill-pro"></div></div>
          </div>
          <div class="prog-item">
            <div class="prog-label"><span>Grasas</span> <span id="txt-fat">0/0g</span></div>
            <div class="prog-bar"><div id="bar-fat" class="fill fill-fat"></div></div>
          </div>
          <div class="prog-item">
            <div class="prog-label"><span>Carbos</span> <span id="txt-car">0/0g</span></div>
            <div class="prog-bar"><div id="bar-car" class="fill fill-car"></div></div>
          </div>
        </div>
      </div>

      <!-- MÓDULO 3: HIDRATACIÓN MEJORADA -->
      <div class="card">
        <h2 class="card-title">Hidratación</h2>
        <div class="water-widget">
          <div class="water-info">
            <span class="water-big" id="water-current">0</span>
            <span class="water-target">/ <span id="water-max">2500</span> ml</span>
          </div>
          <div class="prog-bar water-bar-container"><div id="bar-water" class="fill fill-water"></div></div>
          <div class="water-controls">
            <button class="btn-water-minus" onclick="addWater(-250)">- 250ml</button>
            <button class="btn-water-plus" onclick="addWater(250)">+ 250ml</button>
            <button class="btn-water-plus" onclick="addWater(500)">+ 500ml</button>
          </div>
        </div>
      </div>

      <!-- MÓDULO 4: BUSCADOR Y PORCIONES -->
      <div class="card">
        <h2 class="card-title">Añadir Alimento</h2>
        <input type="text" id="search-input" placeholder="Buscar alimento (Ej: Arepa, Pollo, Eggs...)" autocomplete="off">
        <ul id="search-results" class="results-list hidden"></ul>

        <!-- Calculadora de Porciones -->
        <div id="portion-calculator" class="portion-box hidden">
          <h3 id="preview-name" class="preview-title">Alimento</h3>
          
          <div class="form-row grid-2">
            <div class="form-group">
              <label>Medida</label>
              <select id="preview-measure"></select>
            </div>
            <div class="form-group">
              <label>Cantidad</label>
              <input type="number" id="preview-qty" value="1" min="0.1" step="any">
            </div>
          </div>

          <div class="preview-macros">
            <div><span class="pm-val" id="pm-cal">0</span><span class="pm-lbl">Kcal</span></div>
            <div><span class="pm-val" id="pm-pro">0g</span><span class="pm-lbl">Prot</span></div>
            <div><span class="pm-val" id="pm-fat">0g</span><span class="pm-lbl">Grasa</span></div>
            <div><span class="pm-val" id="pm-car">0g</span><span class="pm-lbl">Carb</span></div>
          </div>
          <p class="total-weight">Peso total: <span id="pm-weight">0</span>g</p>
          
          <button id="btn-add-food" class="btn-primary" style="margin-top:10px;">Añadir al Diario</button>
        </div>
      </div>

      <!-- MÓDULO 5: LISTA DE CONSUMO -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h2 class="card-title" style="margin:0; border:none;">Consumo de Hoy</h2>
          <button onclick="resetDay()" class="btn-danger-small">Reiniciar Día</button>
        </div>
        <ul id="food-list" class="food-list"></ul>
      </div>

    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
